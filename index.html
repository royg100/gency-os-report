<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מבט 360 - AgencyOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="agencyos.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body>

    <div id="uploadView">
        <div class="upload-container">
            <div style="position: absolute; top: 20px; left: 20px; display: flex; gap: 8px;">
                <a href="/" class="upload-admin-link" style="position: static;"><i class="fas fa-users-cog"></i> מרכז לקוחות</a>
                <a href="/admin" id="adminLinkUpload" class="upload-admin-link" style="display: none; position: static;"><i class="fas fa-cog"></i> ניהול</a>
            </div>
            <div class="logo"><i class="fas fa-layer-group"></i></div>
            <h1>מבט 360</h1>
            <p>גרור את כל קבצי האקסל והדאט לכאן</p>
            <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()" role="button" tabindex="0" aria-label="אזור העלאת קבצים - לחץ או גרור קבצים לכאן" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();document.getElementById('fileInput').click();}">
                <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                <div class="upload-text">גרור קבצים לכאן או לחץ לבחירה</div>
                <input type="file" id="fileInput" multiple accept=".csv, .xlsx, .xls, .dat" style="display:none" aria-label="בחירת קבצים">
            </div>
            <div id="filesCount" class="files-count" style="display: none;">
                <i class="fas fa-file me-2"></i><span id="filesCountText">0 קבצים נבחרו</span>
            </div>
            <div id="filesList" class="files-list-container" style="display: none;">
                <!-- Files will be inserted here -->
            </div>
            <div id="fileList" style="text-align:right; margin-bottom:20px; display:none;"></div>
            <div class="loader" id="loader"></div>
            <button class="btn-clear-files" id="btnClearFiles" onclick="clearAllFiles()" style="display: none;" disabled>
                <i class="fas fa-trash me-2"></i>נקה כל הקבצים
            </button>
            <button class="generate-btn" id="generateBtn" onclick="uploadFiles()" aria-label="צור דשבורד מהקבצים שנבחרו"><i class="fas fa-magic"></i> צור דשבורד</button>
        </div>
    </div>

    <div id="dashboardView">
        <div class="top-bar">
            <div class="app-brand"><i class="fas fa-layer-group"></i> AgencyOS 360</div>
            <div class="top-actions">
                <a href="/" class="top-admin-link"><i class="fas fa-users-cog"></i> מרכז לקוחות</a>
                <a href="/admin" id="adminLinkWrap" class="top-admin-link" style="display: none;"><i class="fas fa-cog"></i> ניהול</a>
                <button class="btn-save-crm" onclick="saveToCrm()" aria-label="שמור ל-CRM" style="background: #10b981 !important; font-weight: 600;"><i class="fas fa-save"></i> שמור ל-CRM</button>
                <button class="btn-add-files" onclick="showAddFilesDialog()" aria-label="הוסף עוד קבצים" style="background: #3b82f6 !important; font-weight: 600;"><i class="fas fa-plus-circle"></i> הוסף קבצים</button>
                <button class="btn-pdf" onclick="downloadActiveReport()" aria-label="הורד דוח PDF של הדוח הנוכחי"><i class="fas fa-file-download"></i> הורד PDF מלא</button>
                <button class="btn-excel" onclick="exportToExcel()" aria-label="ייצא ל-Excel" style="background: #10b981 !important; font-weight: 600;"><i class="fas fa-file-excel"></i> ייצוא Excel</button>
                <button class="btn-print" onclick="printActiveReport()" aria-label="הדפס את הדוח הנוכחי"><i class="fas fa-print"></i> הדפסה</button>
                <button class="btn-insights" onclick="printInsightsReport()" aria-label="הפק דוח תובנות והמלצות טיפול" style="background: #0284c7 !important; font-weight: 600;"><i class="fas fa-lightbulb"></i> הפק דוח תובנות</button>
                <button onclick="location.reload()" aria-label="טען מחדש את הדף"><i class="fas fa-sync"></i> חדש</button>
            </div>
        </div>
        <div class="tabs-container" id="tabsContainer"></div>
        <div class="content-area" id="contentArea"></div>
    </div>

    <!-- Modal להצגת מוצרי לקוח - עיצוב משופר -->
    <div class="client-modal" id="clientModal" onclick="if(event.target===this) closeClientModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="modalClientName">מוצרי לקוח</h2>
                <button class="close-modal" onclick="closeClientModal()" aria-label="סגור" title="סגור">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="client-products" id="clientProducts">
                <!-- התוכן יוטען כאן -->
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>
    
    <!-- Progress Overlay -->
    <div class="progress-overlay" id="progressOverlay">
        <div class="progress-box">
            <div class="progress-title" id="progressTitle">מכין PDF...</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
        </div>
    </div>

    <script>
        const uploadView = document.getElementById('uploadView');
        const dashboardView = document.getElementById('dashboardView');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const generateBtn = document.getElementById('generateBtn');
        const loader = document.getElementById('loader');
        const tabsContainer = document.getElementById('tabsContainer');
        const contentArea = document.getElementById('contentArea');

        let reportsData = []; 
        let activeReportIndex = 0;
        let selectedFiles = []; // רשימת קבצים שנבחרו להעלאה

        fetch('/check_auth', { credentials: 'include' })
            .then(r => r.json())
            .then(d => {
                if (!d.authenticated || d.username !== 'ADMIN') return;
                const wrap = document.getElementById('adminLinkWrap');
                if (wrap) wrap.style.display = 'flex';
                const up = document.getElementById('adminLinkUpload');
                if (up) up.style.display = 'flex';
            })
            .catch(() => {});

        // Validation של קבצים
        function validateFiles(files) {
            const maxSize = 10 * 1024 * 1024; // 10MB
            const allowedTypes = ['.csv', '.xlsx', '.xls', '.dat'];
            const errors = [];
            
            Array.from(files).forEach(file => {
                const ext = '.' + file.name.split('.').pop().toLowerCase();
                if (!allowedTypes.includes(ext)) {
                    errors.push(`קובץ ${file.name} אינו בפורמט נתמך )CSV, XLSX, XLS, DAT(`);
                }
                if (file.size > maxSize) {
                    errors.push(`קובץ ${file.name} גדול מדי )מקסימום 10MB(`);
                }
                if (file.size === 0) {
                    errors.push(`קובץ ${file.name} ריק`);
                }
            });
            
            if (files.length > 50) {
                errors.push('יותר מדי קבצים )מקסימום 50(');
            }
            
            return errors;
        }

        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            
            if (files.length > 0) {
                const errors = validateFiles(files);
                if (errors.length > 0) {
                    alert('שגיאות:\n' + errors.join('\n'));
                    fileInput.value = '';
                    return;
                }
                
                const onDashboard = reportsData.length > 0 && dashboardView.style.display === 'flex';
                const added = [];
                Array.from(files).forEach(file => {
                    const exists = selectedFiles.some(f => f.name === file.name && f.size === file.size && f.lastModified === file.lastModified);
                    if (!exists) {
                        selectedFiles.push(file);
                        added.push(file);
                    }
                });
                
                fileInput.value = '';
                updateFilesDisplay();

                if (onDashboard && added.length > 0) {
                    uploadFiles(true);
                }
            }
        });
        
        // פונקציה לעדכון תצוגת רשימת הקבצים
        function updateFilesDisplay() {
            const filesList = document.getElementById('filesList');
            const filesCount = document.getElementById('filesCount');
            const filesCountText = document.getElementById('filesCountText');
            const generateBtn = document.getElementById('generateBtn');
            const btnClearFiles = document.getElementById('btnClearFiles');
            
            if(selectedFiles.length === 0) {
                filesList.style.display = 'none';
                filesCount.style.display = 'none';
                generateBtn.style.display = 'none';
                btnClearFiles.style.display = 'none';
            } else {
                filesList.style.display = 'block';
                filesCount.style.display = 'block';
                generateBtn.style.display = 'inline-block';
                btnClearFiles.style.display = 'block';
                btnClearFiles.disabled = false;
                
                // עדכון ספירת קבצים
                filesCountText.innerText = `${selectedFiles.length} ${selectedFiles.length === 1 ? 'קובץ נבחר' : 'קבצים נבחרו'}`;
                
                // עדכון רשימת הקבצים
                filesList.innerHTML = '';
                selectedFiles.forEach((file, index) => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item';
                    
                    const fileSize = (file.size / 1024).toFixed(2); // KB
                    const fileSizeText = fileSize < 1024 ? `${fileSize} KB` : `${(file.size / (1024 * 1024)).toFixed(2)} MB`;
                    
                    fileItem.innerHTML = `
                        <div class="file-info">
                            <i class="fas fa-file-excel file-icon"></i>
                            <div class="file-details">
                                <div class="file-name">${file.name}</div>
                                <div class="file-size">${fileSizeText}</div>
                            </div>
                        </div>
                        <button class="file-remove-btn" onclick="removeFileFromQueue(${index})" title="הסר קובץ">
                            <i class="fas fa-times"></i>
                        </button>
                    `;
                    filesList.appendChild(fileItem);
                });
            }
        }

        // פונקציה להסרת קובץ מהרשימה
        function removeFileFromQueue(index) {
            if(index >= 0 && index < selectedFiles.length) {
                selectedFiles.splice(index, 1);
                updateFilesDisplay();
            }
        }

        // פונקציה לניקוי כל הקבצים
        function clearAllFiles() {
            selectedFiles = [];
            updateFilesDisplay();
        }

        // Drag & Drop support
        const dropZone = document.getElementById('dropZone');
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => {
                dropZone.style.borderColor = 'var(--primary)';
                dropZone.style.background = '#fdf2f8';
                dropZone.style.transform = 'scale(1.02)';
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => {
                dropZone.style.borderColor = '#cbd5e1';
                dropZone.style.background = '#fdfdfd';
                dropZone.style.transform = 'scale(1)';
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                // הוספת קבצים חדשים לרשימה (מניעת כפילויות)
                Array.from(files).forEach(file => {
                    const errors = validateFiles([file]);
                    if (errors.length > 0) {
                        alert('שגיאות:\n' + errors.join('\n'));
                        return;
                    }
                    
                    const exists = selectedFiles.some(f => f.name === file.name && f.size === file.size && f.lastModified === file.lastModified);
                    if(!exists) {
                        selectedFiles.push(file);
                    }
                });
                
                updateFilesDisplay();
            }
        }, false);

        async function uploadFiles(isAdditionalUpload = false) {
            if (selectedFiles.length === 0) {
                alert('אנא בחר קבצים להעלאה');
                return;
            }
            
            const filesToProcess = [...selectedFiles]; // עותק של הרשימה
            const processedFileNames = filesToProcess.map(f => f.name);
            
            if (!isAdditionalUpload) {
                generateBtn.style.display = 'none'; 
                loader.style.display = 'block';
            } else {
                showProgress('מעלה קבצים נוספים...');
            }
            
            const formData = new FormData();
            for (const file of filesToProcess) formData.append('files[]', file);

            try {
                const response = await fetch('/upload', { 
                    method: 'POST', 
                    body: formData,
                    credentials: 'include',
                    signal: AbortSignal.timeout(120000)
                });
                
                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                if (!response.ok) {
                    throw new Error(`שגיאת שרת: ${response.status} ${response.statusText}`);
                }
                
                const data = await response.json();
                
                if (!data || data.length === 0) { 
                    if (!isAdditionalUpload) {
                        loader.style.display = 'none';
                        generateBtn.style.display = 'inline-block';
                    } else {
                        hideProgress();
                    }
                    showToast('warning', 'אזהרה', 'לא נמצאו נתונים בעיבוד הקבצים. אנא ודא שהקבצים מכילים נתונים תקינים.');
                    return; 
                }
                
                // הסרת הקבצים שעובדו מהרשימה (אבל לא ניקוי מלא - כדי לאפשר הוספת קבצים נוספים)
                selectedFiles = selectedFiles.filter(f => !processedFileNames.includes(f.name));
                updateFilesDisplay();
                
                if (isAdditionalUpload && reportsData.length > 0) {
                    const fam = (r) => r.family || r.family_name || 'כללי';
                    const existingFamilyKeys = new Set(reportsData.map(fam));
                    for (const newReport of data) {
                        const nf = fam(newReport);
                        if (existingFamilyKeys.has(nf)) {
                            const existingIndex = reportsData.findIndex(r => fam(r) === nf);
                            if (existingIndex !== -1) {
                                const ex = reportsData[existingIndex];
                                const rd = ex.raw_data || {};
                                const nd = newReport.raw_data || {};
                                rd.raw_ins = [...(rd.raw_ins || []), ...(nd.raw_ins || [])];
                                rd.raw_fin = [...(rd.raw_fin || []), ...(nd.raw_fin || [])];
                                rd.members = Object.assign({}, rd.members || {}, nd.members || {});
                                ex.raw_data = rd;
                                try {
                                    const rr = await fetch('/render_report', {
                                        method: 'POST',
                                        credentials: 'include',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ raw_data: rd })
                                    });
                                    if (rr.ok) {
                                        const j = await rr.json();
                                        if (j.html) ex.html = j.html;
                                        if (j.insights_report) ex.insights_report = j.insights_report;
                                    }
                                } catch (e) { console.warn('render_report failed', e); }
                            }
                        } else {
                            reportsData.push(newReport);
                        }
                    }
                    hideProgress();
                    showToast('success', 'הצלחה', `הוספו ${data.length} דוחות בהצלחה`);
                    initDashboard(reportsData);
                } else {
                    reportsData = data; 
                    if (!isAdditionalUpload) {
                        initDashboard(data);
                    } else {
                        hideProgress();
                        initDashboard(reportsData);
                    }
                }
            } catch (error) { 
                console.error('Upload error:', error);
                if (!isAdditionalUpload) {
                    loader.style.display = 'none';
                    generateBtn.style.display = 'inline-block';
                } else {
                    hideProgress();
                }
                
                let errorMsg = 'שגיאה בהעלאת הקבצים';
                if (error.name === 'TimeoutError') {
                    errorMsg = 'העלאה ארכה יותר מדי זמן. נסה שוב או העלה פחות קבצים.';
                } else if (error.message) {
                    errorMsg = error.message;
                }
                
                showToast('error', 'שגיאה', errorMsg);
            }
        }
        
        function showAddFilesDialog() {
            // פתיחת דיאלוג בחירת קבצים
            fileInput.click();
            // הקבצים יתווספו לרשימה דרך ה-event listener הקיים
        }

        async function saveToCrm() {
            if (!reportsData || !reportsData.length) {
                showToast('error', 'שגיאה', 'אין דשבורד לשמירה');
                return;
            }
            const r = reportsData[0];
            const defaultName = (r.family || r.family_name || 'כללי').trim();
            const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
            const swalResult = await Swal.fire({
                title: 'שמור ל-CRM',
                html: '<label style="display:block;text-align:right;margin-bottom:6px;font-weight:600;">שם לתצוגה</label>' +
                    '<input id="swal-crm-name" class="swal2-input" value="' + esc(defaultName) + '" style="margin-bottom:12px;">' +
                    '<label style="display:block;text-align:right;margin-bottom:6px;font-weight:600;">טלפון</label>' +
                    '<input id="swal-crm-phone" class="swal2-input" type="tel" placeholder="למשל 050-1234567">',
                showCancelButton: true,
                confirmButtonText: 'שמור',
                cancelButtonText: 'ביטול',
                preConfirm: () => {
                    const n = (document.getElementById('swal-crm-name').value || '').trim() || defaultName;
                    const p = (document.getElementById('swal-crm-phone').value || '').trim();
                    return { name: n, phone: p };
                }
            });
            if (!swalResult.isConfirmed) return;
            const familyName = swalResult.value.name;
            const phone = swalResult.value.phone || null;
            const payload = {
                family_name: familyName,
                phone: phone || undefined,
                raw_data: r.raw_data || { raw_ins: [], raw_fin: [], members: {} },
                html: r.html || '',
                insights_report: r.insights_report || {}
            };
            try {
                const res = await fetch('/api/dashboards', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                if (!res.ok) {
                    const j = await res.json().catch(() => ({}));
                    showToast('warning', 'שמירה ל-CRM', (j.error || res.statusText) + ' – נסה שוב.');
                    return;
                }
                showToast('success', 'נשמר ל-CRM', 'הדשבורד נשמר בהצלחה.');
            } catch (e) {
                showToast('error', 'שמירה ל-CRM', e.message || 'שגיאה בשמירה.');
            }
        }

        // Toast Notification System
        function showToast(type, title, message, duration = 3000) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle',
                warning: 'fa-exclamation-triangle'
            };
            
            toast.innerHTML = `
                <i class="fas ${icons[type]}"></i>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideInLeft 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }
        
        // Progress Bar System
        function showProgress(title = 'מכין PDF...') {
            const overlay = document.getElementById('progressOverlay');
            const progressTitle = document.getElementById('progressTitle');
            progressTitle.textContent = title;
            overlay.classList.add('active');
            updateProgress(0);
        }
        
        function updateProgress(percent) {
            const bar = document.getElementById('progressBar');
            const text = document.getElementById('progressText');
            bar.style.width = percent + '%';
            text.textContent = Math.round(percent) + '%';
        }
        
        function hideProgress() {
            const overlay = document.getElementById('progressOverlay');
            overlay.classList.remove('active');
            setTimeout(() => updateProgress(0), 300);
        }

        function buildInsightsReportHtml(ir, family, reportIndex) {
            const fam = family || 'כללי';
            const date = new Date().toLocaleDateString('he-IL', { day: 'numeric', month: 'long', year: 'numeric' });
            let h = '<div class="insights-report" data-report-index="' + reportIndex + '">';
            h += '<div class="ir-header">';
            h += '<i class="fas fa-lightbulb"></i>';
            h += '<h1>דוח תובנות והמלצות טיפול</h1>';
            h += '<p class="ir-meta">' + fam + ' | תאריך הפקה: ' + date + '</p>';
            h += '</div>';
            const sum = (ir.executive_summary || '').trim();
            if (sum) {
                h += '<section class="ir-section ir-summary"><h2>סיכום תמציתי</h2><p>' + sum + '</p></section>';
            }
            const insights = ir.insights || [];
            if (insights.length > 0) {
                h += '<section class="ir-section ir-insights"><h2>תובנות</h2><ul>';
                insights.forEach(function(i) {
                    const sev = i.severity ? ' <span class="ir-sev ' + (i.severity === 'חשוב' ? 'sev-important' : 'sev-review') + '">' + i.severity + '</span>' : '';
                    h += '<li><strong>' + (i.client || '') + '</strong>' + sev + ': ' + (i.text || '') + '</li>';
                });
                h += '</ul></section>';
            }
            const recs = ir.recommendations || [];
            if (recs.length > 0) {
                h += '<section class="ir-section ir-recommendations"><h2>המלצות טיפול</h2>';
                recs.forEach(function(r) {
                    h += '<div class="ir-rec">';
                    h += '<h3>' + (r.title || '') + (r.client ? ' – ' + r.client : '') + '</h3>';
                    h += '<p class="ir-rec-text">' + (r.recommendation || '') + '</p>';
                    if (r.background) h += '<p class="ir-rec-bg"><small>רקע: ' + r.background + '</small></p>';
                    h += '</div>';
                });
                h += '</section>';
            }
            const appIns = ir.appendix_ins || [];
            const appFin = ir.appendix_fin || [];
            if (appIns.length > 0 || appFin.length > 0) {
                h += '<section class="ir-section ir-appendix"><h2>נספח – טבלאות מקוצר</h2>';
                if (appIns.length > 0) {

        function initDashboard(data) {

                const tab = document.createElement('button');
                tab.className = `tab-btn ${reportIndex === 0 ? 'active' : ''}`;

                const recTab = document.createElement('button');

                recTab.setAttribute('aria-label', `דוח תובנות והמלצות טיפול עבור ${report.family || reportIndex + 1}`);
                recTab.setAttribute('role', 'tab');
                recTab.setAttribute('aria-selected', 'false');
                recTab.onclick = () => switchTab(tabIndex + 1);
                recTab.onkeydown = (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        switchTab(tabIndex + 1);
                    }
                };
                tabsContainer.appendChild(recTab);

                // יצירת iframe לדוח
                const iframe = document.createElement('iframe');
                iframe.id = `report-frame-${tabIndex}`;
                iframe.style.display = reportIndex === 0 ? 'block' : 'none';
                iframe.setAttribute('loading', 'lazy');
                iframe.setAttribute('title', `דוח ${report.family || reportIndex + 1}`);
                contentArea.appendChild(iframe);
                
                // שמירת ה-HTML לטעינה
                iframe.dataset.html = report.html;

                    loadReportContent(iframe, report.html);
                    delete iframe.dataset.html;

                // יצירת div להמלצות / דוח תובנות והמלצות טיפול
                const recDiv = document.createElement('div');
                recDiv.id = `recommendations-${tabIndex + 1}`;
                recDiv.className = 'recommendations-container insights-report-container';
                recDiv.style.display = 'none';
                recDiv.style.padding = '20px';
                recDiv.style.overflowY = 'auto';
                recDiv.style.height = '100%';
                recDiv.style.background = '#f1f5f9';
                recDiv.dataset.reportIndex = String(reportIndex);
                contentArea.appendChild(recDiv);

                recDiv.innerHTML = buildInsightsReportHtml(ir || {}, report.family || 'כללי', reportIndex);

        function loadReportContent(iframe, html) {
            try {
                const doc = iframe.contentWindow.document;
                doc.open(); 
                doc.write(html); 
                doc.close();
                
                // הוספת event listeners לשמות לקוחות אחרי טעינת התוכן
                setTimeout(() => {
                    addClientClickListeners(iframe);
                }, 500);
            } catch (error) {
                console.error('Error loading report:', error);
                iframe.srcdoc = html;
                setTimeout(() => {
                    addClientClickListeners(iframe);
                }, 500);
            }
        }

        function addClientClickListeners(iframe) {
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                
                // מציאת כל שמות הלקוחות בטבלאות
                const clientCells = doc.querySelectorAll('td.font-bold, .mem-item strong');
                
                clientCells.forEach(cell => {
                    const clientName = cell.textContent.trim();
                    if (clientName && clientName.length > 1 && !clientName.includes('סה"כ') && !clientName.includes('₪')) {
                        cell.classList.add('clickable-client');
                        cell.style.cursor = 'pointer';
                        cell.title = 'לחץ לראות מוצרים';
                        cell.onclick = (e) => {
                            e.stopPropagation();
                            showClientProducts(clientName);
                        };
                    }
                });
            } catch (error) {
                console.error('Error adding click listeners:', error);
            }
        }

        function switchTab(activeIndex) {
            const totalTabs = reportsData.length * 2; // כל דוח = 2 טאבים
            if (activeIndex < 0 || activeIndex >= totalTabs) return;
            
            // עדכון טאבים
            document.querySelectorAll('.tab-btn').forEach((t, i) => {
                const isActive = i === activeIndex;
                t.classList.toggle('active', isActive);
                t.setAttribute('aria-selected', isActive ? 'true' : 'false');
            });
            
            // הסתרת כל התוכן
            document.querySelectorAll('iframe').forEach(f => f.style.display = 'none');
            document.querySelectorAll('.recommendations-container').forEach(d => d.style.display = 'none');
            
            // הצגת התוכן המתאים
            if (activeIndex % 2 === 0) {
                // טאב דוח רגיל
                const reportIndex = activeIndex / 2;
                const iframe = document.getElementById(`report-frame-${activeIndex}`);
                if (iframe && reportsData[reportIndex]) {
                    iframe.style.display = 'block';
                    // תמיד נטען את התוכן מהנתונים
                    if (reportsData[reportIndex].html) {
                        loadReportContent(iframe, reportsData[reportIndex].html);
                    }
                }

                // טאב המלצות
                const recDiv = document.getElementById(`recommendations-${activeIndex}`);
                if (recDiv) {
                    recDiv.style.display = 'block';

        /* הגדרת רוחב אופטימלי ל-PDF כדי למנוע חיתוך צדדי */
        .pdf-export-wrapper {
            width: 190mm; /* קצת פחות מ-A4 כדי להשאיר מקום לשוליים */
            margin: 0 auto;
            background: white;
        }

        /* הסתרת אלמנטים לא רצויים */
        .no-print, #loadingMsg { display: none !important; }
        
        /* אופטימיזציה של רווחים ב-PDF */
        .header { margin-bottom: 12px !important; padding-bottom: 8px !important; }
        .kpi-container { margin-bottom: 12px !important; padding: 12px !important; }
        .sec-title { margin-top: 10px !important; margin-bottom: 8px !important; padding: 5px 10px !important; }
        .members-grid { margin-bottom: 12px !important; gap: 8px !important; }
        .checklist-grid { margin-bottom: 12px !important; gap: 8px !important; }
        .charts-section { margin-top: 8px !important; margin-bottom: 12px !important; gap: 10px !important; }
        table { margin-bottom: 12px !important; }
        .recommendations-box { margin-top: 12px !important; padding: 12px !important; }
        .footer { margin-top: 15px !important; padding-top: 8px !important; }
        
        /* כותרות עמוד - רווח קטן יותר */
        .sec-title:first-child { margin-top: 5px !important; }
        div[style*="page-break-after: always"] .sec-title:first-child { margin-top: 5px !important; }
        
        /* שיפור תצוגת גרפים ב-PDF */
        .chart-wrapper {
            page-break-inside: avoid !important;
            margin-bottom: 12px !important;
        }
        .chart-wrapper canvas, .chart-wrapper img {
            max-width: 100% !important;
            height: auto !important;
        }
        
        /* שיפור תצוגת טבלאות למניעת שבירה */
        table { 
            page-break-inside: auto; 
            width: 100% !important; 
            layout: fixed; 
            direction: rtl !important;
        }
        th, td { 
            word-spacing: 0.1em !important; 
            white-space: normal !important; 
            word-wrap: break-word !important;
        }
        tr { page-break-inside: avoid !important; page-break-after: auto; }
        thead { display: table-header-group; }
        tfoot { display: table-footer-group; }
        
        /* מניעת חיתוך של כרטיסים ואלמנטים חשובים */
        .kpi-container, .check-card, .mem-item, .sec-title, .charts-section, .members-grid, .checklist-grid {
            page-break-inside: avoid !important;
            word-spacing: 0.1em !important;
            white-space: normal !important;
        }
        
        /* תיקון נוסף לכל האלמנטים עם טקסט */
        h1, h2, h3, h4, h5, h6, p, div, span, strong, em, li, td, th, .header, .footer, .rec-item, .kpi-title, .kpi-value, .check-label, .check-status, .mem-item strong {
            word-spacing: 0.1em !important;
            white-space: normal !important;
            direction: rtl !important;
        }
        
        /* מניעת שבירה מיותרת - רצף טבעי */
        div[style*="page-break-inside: avoid"] {
            page-break-inside: avoid !important;
        }
    `;
    container.appendChild(styleFix);

    // מיקום הקונטיינר מחוץ למסך (כדי שהמשתמש לא יראה את התהליך)
    container.style.position = 'absolute';
    container.style.left = '-9999px';
    container.style.top = '0';
    document.body.appendChild(container);

    // 4. הגדרות הספרייה html2pdf - אופטימליות ל-PDF
    const opt = {
        margin:       [8, 8, 8, 8], // שוליים קטנים יותר
        filename:     `סיכום_תיק_${familyName}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { 
            scale: 2, // איכות גבוהה
            useCORS: true, 
            logging: false,
            letterRendering: true,
            allowTaint: true,
            scrollY: 0,
            windowWidth: 1200,
            windowHeight: 1600,
            onclone: function(clonedDoc) {
                // תיקון קריטי לטקסט עברי על העותק המשוכפל
                const clonedBody = clonedDoc.body;
                clonedBody.style.direction = 'rtl';
                clonedBody.style.textAlign = 'right';
                clonedBody.style.wordSpacing = '0.1em';
                clonedBody.style.letterSpacing = '0.01em';
                clonedBody.style.whiteSpace = 'normal';
                clonedBody.style.textRendering = 'optimizeLegibility';
                clonedBody.style.unicodeBidi = 'embed';
                
                // תיקון לכל האלמנטים עם טקסט
                const allElements = clonedDoc.querySelectorAll('*');
                allElements.forEach(el => {
                    if (el.style) {
                        el.style.wordSpacing = '0.1em';
                        el.style.whiteSpace = 'normal';
                        el.style.letterSpacing = '0.01em';
                        if (!el.style.direction || el.style.direction === 'ltr') {
                            el.style.direction = 'rtl';
                        }
                    }
                });
            }
        },
        jsPDF:        { 
            unit: 'mm', 
            format: 'a4', 
            orientation: 'portrait',
            compress: true
        },
        // הגדרות אופטימליות למניעת שבירה באמצע
        pagebreak:    { 
            mode: ['avoid-all', 'css', 'legacy'], 
            avoid: [
                'tr', 
                '.kpi-container', 
                '.sec-title', 
                '.check-card', 
                '.mem-item', 
                '.header', 
                '.charts-section', 
                '.members-grid', 
                '.checklist-grid',
                'table',
                '.recommendations-box'
            ]
        }
    };

    // ביצוע ההמרה - המתין שהגרפים יסיימו את האנימציה ואז המרה לתמונות
    updateProgress(20);
    setTimeout(() => {
        updateProgress(40);
        // המרת קנבסים לתמונות
        convertCanvasesToImages();
        updateProgress(60);
        
        // המתין קצת שהתמונות יטענו ואז יצירת ה-PDF
        setTimeout(() => {
            updateProgress(80);
            html2pdf().set(opt).from(contentWrapper).save().then(() => {
                updateProgress(100);
                // ניקוי לאחר סיום
                document.body.removeChild(container);
                btn.innerHTML = originalText;
                btn.disabled = false;
                setTimeout(() => {
                    hideProgress();
                    showToast('success', 'הצלחה', 'ה-PDF נוצר בהצלחה');
                }, 500);
            }).catch(err => {
                console.error(err);
                hideProgress();
                showToast('error', 'שגיאה', 'שגיאה ביצירת PDF: ' + err.message);
                if (document.body.contains(container)) document.body.removeChild(container);
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        }, 500); // השהייה קצרה לטעינת התמונות
        }, 2500); // השהייה כדי שהגרפים יסיימו את האנימציה (2 שניות + 0.5 שניות)
}

        async function tryLoadDashboardFromQuery() {
            const params = new URLSearchParams(location.search);
            const id = params.get('dashboard_id');
            if (!id) return;
            loader.style.display = 'block';
            try {
                const r = await fetch('/api/dashboards/' + encodeURIComponent(id), { credentials: 'include' });
                if (r.status === 401) { window.location.href = '/login'; return; }
                if (!r.ok) { showToast('error', 'שגיאה', 'דשבורד לא נמצא'); loader.style.display = 'none'; return; }
                const d = await r.json();
                const reports = (d.reports || []).map(function (x) {
                    return { family: x.family || d.family_name || 'כללי', html: x.html || '', raw_data: x.raw_data || {}, insights_report: x.insights_report || {} };
                });
                if (!reports.length) { showToast('warning', 'אזהרה', 'אין דוחות בדשבורד'); loader.style.display = 'none'; return; }
                reportsData = reports;
                initDashboard(reports);
            } catch (e) {
                showToast('error', 'שגיאה', (e.message || 'טעינת דשבורד נכשלה'));
            } finally {
                loader.style.display = 'none';
            }
        }
        tryLoadDashboardFromQuery();
    </script>
