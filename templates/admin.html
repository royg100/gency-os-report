<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgencyOS - ניהול מערכת</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/agencyos.css">
</head>
<body>
    <div class="top-bar">
        <span><i class="fas fa-cog"></i> ניהול מערכת</span>
        <div style="display:flex; gap:10px;">
            <a href="/"><i class="fas fa-home"></i> חזרה למערכת</a>
            <a href="/logout"><i class="fas fa-sign-out-alt"></i> התנתקות</a>
        </div>
    </div>

    <div class="tabs">
        <button type="button" class="tab active" data-tab="users">ניהול משתמשים</button>
        <button type="button" class="tab" data-tab="productions">הפקות אחרונות</button>
        <button type="button" class="tab" data-tab="sessions">מחוברים כעת</button>
    </div>

    <div id="panel-users" class="panel active">
        <div class="card">
            <div class="toolbar">
                <h2 style="margin:0;">משתמשים</h2>
                <button type="button" class="btn btn-add" id="btnAddUser"><i class="fas fa-plus"></i> הוסף משתמש</button>
            </div>
            <div id="usersTableWrap">
                <table>
                    <thead><tr><th>שם משתמש</th><th>תפקיד</th><th>נוצר</th><th>פעולות</th></tr></thead>
                    <tbody id="usersBody"></tbody>
                </table>
            </div>
            <div id="usersEmpty" class="empty-msg" style="display:none;">אין משתמשים.</div>
        </div>
    </div>

    <div id="panel-productions" class="panel">
        <div class="card">
            <div class="toolbar">
                <h2 style="margin:0;">הפקות אחרונות</h2>
                <div class="filter-row">
                    <label>סינון לפי משתמש:</label>
                    <select id="prodFilterUser">
                        <option value="">הכל</option>
                    </select>
                    <label>מגבלה:</label>
                    <select id="prodLimit">
                        <option value="20">20</option>
                        <option value="50" selected>50</option>
                        <option value="100">100</option>
                    </select>
                    <button type="button" class="btn btn-edit" id="btnRefreshProd"><i class="fas fa-sync"></i> רענן</button>
                </div>
            </div>
            <div id="productionsTableWrap" style="overflow-x: auto;">
                <table style="min-width: 800px;">
                    <thead><tr><th>משתמש</th><th>תאריך</th><th>דוח</th><th>קבצים</th><th>שמות קבצים</th></tr></thead>
                    <tbody id="productionsBody"></tbody>
                </table>
            </div>
            <div id="productionsEmpty" class="empty-msg" style="display:none;">אין הפקות.</div>
        </div>
    </div>

    <div id="panel-sessions" class="panel">
        <div class="card">
            <div class="toolbar">
                <h2 style="margin:0;"><i class="fas fa-user-clock"></i> מחוברים כעת</h2>
                <button type="button" class="btn btn-edit" id="btnRefreshSessions"><i class="fas fa-sync"></i> רענן</button>
            </div>
            <div id="sessionsTableWrap" style="overflow-x: auto;">
                <table style="min-width: 500px;">
                    <thead><tr><th>משתמש</th><th>התחבר ב־</th><th>פעילות אחרונה</th></tr></thead>
                    <tbody id="sessionsBody"></tbody>
                </table>
            </div>
            <div id="sessionsEmpty" class="empty-msg" style="display:none;">אין משתמשים מחוברים.</div>
        </div>
    </div>

    <div id="modalUser" class="modal-overlay">
        <div class="modal">
            <h3 id="modalUserTitle">הוסף משתמש</h3>
            <input type="hidden" id="modalUserId" value="">
            <div class="input-group">
                <label>שם משתמש</label>
                <input type="text" id="modalUsername" placeholder="שם משתמש">
            </div>
            <div class="input-group">
                <label>סיסמה</label>
                <input type="password" id="modalPassword" placeholder="סיסמה">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-edit" id="modalUserSave">שמור</button>
                <button type="button" class="btn" style="background:#e2e8f0; color:#475569;" id="modalUserCancel">ביטול</button>
            </div>
        </div>
    </div>

    <div id="modalPermissions" class="modal-overlay">
        <div class="modal" style="max-width: 480px;">
            <h3 id="modalPermissionsTitle">הרשאות משתמש</h3>
            <input type="hidden" id="modalPermissionsUserId" value="">
            <div id="modalPermissionsCheckboxes"></div>
            <div class="modal-actions">
                <button type="button" class="btn btn-edit" id="modalPermissionsSave">שמור הרשאות</button>
                <button type="button" class="btn" style="background:#e2e8f0; color:#475569;" id="modalPermissionsCancel">ביטול</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        var users = [];
        var productions = [];

        function api(path, opts) {
            opts = opts || {};
            opts.credentials = 'include';
            opts.headers = opts.headers || {};
            if (opts.body && typeof opts.body === 'string' && !opts.headers['Content-Type'])
                opts.headers['Content-Type'] = 'application/json';
            return fetch(path, opts).then(function(r) {
                var ct = r.headers.get('content-type');
                if (ct && ct.indexOf('application/json') !== -1)
                    return r.json().then(function(j) { return { ok: r.ok, status: r.status, json: j }; });
                return { ok: r.ok, status: r.status, json: {} };
            });
        }

        function toast(msg, isErr) {
            var el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast show ' + (isErr ? 'err' : 'ok');
            setTimeout(function() { el.classList.remove('show'); }, 3000);
        }

        function switchTab(name) {
            document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.dataset.tab === name); });
            document.querySelectorAll('.panel').forEach(function(p) { p.classList.toggle('active', p.id === 'panel-' + name); });
            if (name === 'users') loadUsers();
            if (name === 'productions') loadProductions();
            if (name === 'sessions') loadSessions();
        }

        document.querySelectorAll('.tab').forEach(function(t) {
            t.addEventListener('click', function() { switchTab(t.dataset.tab); });
        });

        function loadUsers() {
            return api('/admin/users').then(function(x) {
                if (!x.ok) { toast(x.json && x.json.error ? x.json.error : 'שגיאה בטעינת משתמשים', true); return; }
                users = x.json || [];
                var tbody = document.getElementById('usersBody');
                tbody.innerHTML = '';
                var empty = document.getElementById('usersEmpty');
                if (!users.length) { empty.style.display = 'block'; return; }
                empty.style.display = 'none';
                users.forEach(function(u) {
                    var tr = document.createElement('tr');
                    var isAdmin = u.username === 'ADMIN';
                    tr.innerHTML =
                        '<td>' + (u.username || '') + '</td>' +
                        '<td>' + (u.role === 'admin' ? 'מנהל' : 'משתמש') + '</td>' +
                        '<td>' + (u.created_at ? new Date(u.created_at).toLocaleString('he-IL') : '—') + '</td>' +
                        '<td>' +
                            (isAdmin ? '' : '<button type="button" class="btn btn-edit btn-edit-user" data-id="' + u.id + '" data-username="' + (u.username || '') + '">ערוך סיסמה</button>') +
                            (isAdmin ? '' : ' <button type="button" class="btn btn-perms btn-perms-user" data-id="' + u.id + '" data-username="' + (u.username || '') + '" data-permissions="' + (typeof u.permissions !== 'undefined' ? JSON.stringify(u.permissions || []).replace(/"/g, '&quot;') : '[]') + '">הרשאות</button>') +
                            (isAdmin ? '' : ' <button type="button" class="btn btn-del btn-del-user" data-id="' + u.id + '" data-username="' + (u.username || '') + '">מחק</button>') +
                        '</td>';
                    tbody.appendChild(tr);
                });
                tbody.querySelectorAll('.btn-edit-user').forEach(function(b) {
                    b.addEventListener('click', function() { openEditUser(b.dataset.id, b.dataset.username); });
                });
                tbody.querySelectorAll('.btn-perms-user').forEach(function(b) {
                    b.addEventListener('click', function() {
                        var perms = [];
                        try { perms = JSON.parse(b.dataset.permissions || '[]'); } catch (e) {}
                        openPermissionsModal(b.dataset.id, b.dataset.username, perms);
                    });
                });
                tbody.querySelectorAll('.btn-del-user').forEach(function(b) {
                    b.addEventListener('click', function() { deleteUser(b.dataset.id, b.dataset.username); });
                });
            });
        }

        function loadSessions() {
            api('/admin/sessions').then(function(x) {
                if (!x.ok) { toast(x.json && x.json.error ? x.json.error : 'שגיאה בטעינה', true); return; }
                var list = Array.isArray(x.json) ? x.json : [];
                var tbody = document.getElementById('sessionsBody');
                var empty = document.getElementById('sessionsEmpty');
                var wrap = document.getElementById('sessionsTableWrap');
                tbody.innerHTML = '';
                if (!list.length) {
                    empty.style.display = 'block';
                    wrap.style.display = 'none';
                    return;
                }
                empty.style.display = 'none';
                wrap.style.display = 'block';
                function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
                list.forEach(function(s) {
                    var loginAt = s.login_at ? new Date(s.login_at).toLocaleString('he-IL') : '—';
                    var lastAt = s.last_seen_at ? new Date(s.last_seen_at).toLocaleString('he-IL') : '—';
                    var tr = document.createElement('tr');
                    tr.innerHTML = '<td>' + esc(s.username) + '</td><td>' + loginAt + '</td><td>' + lastAt + '</td>';
                    tbody.appendChild(tr);
                });
            });
        }

        function loadProductions() {
            var user = document.getElementById('prodFilterUser').value;
            var limit = document.getElementById('prodLimit').value;
            var q = '/admin/productions?limit=' + limit;
            if (user) q += '&user_id=' + encodeURIComponent(user);
            api(q).then(function(x) {
                if (!x.ok) { toast(x.json && x.json.error ? x.json.error : 'שגיאה בטעינת הפקות', true); return; }
                productions = Array.isArray(x.json) ? x.json : [];
                var tbody = document.getElementById('productionsBody');
                tbody.innerHTML = '';
                var empty = document.getElementById('productionsEmpty');
                if (!productions.length) { empty.style.display = 'block'; document.getElementById('productionsTableWrap').style.display = 'none'; return; }
                empty.style.display = 'none';
                document.getElementById('productionsTableWrap').style.display = 'block';
                function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
                productions.forEach(function(p) {
                    var tr = document.createElement('tr');
                    var ts = p.timestamp ? new Date(p.timestamp).toLocaleString('he-IL') : '—';
                    var names = p.file_names || [];
                    var namesHtml = '';
                    if (names.length) {
                        namesHtml = '<div class="file-names-wrap">';
                        names.forEach(function(n) { namesHtml += '<div class="file-name-item"><i class="fas fa-file-alt"></i> ' + esc(n) + '</div>'; });
                        namesHtml += '</div>';
                    } else {
                        namesHtml = '<span style="color:#94a3b8;">—</span>';
                    }
                    tr.innerHTML = '<td>' + esc(p.username) + '</td><td>' + ts + '</td><td>' + esc(p.family_name || 'כללי') + '</td><td>' + (p.file_count || 0) + '</td><td>' + namesHtml + '</td>';
                    tbody.appendChild(tr);
                });
            });
        }

        function fillProdFilterUsers() {
            var sel = document.getElementById('prodFilterUser');
            var cur = sel.value;
            sel.innerHTML = '<option value="">הכל</option>';
            users.forEach(function(u) {
                if (u.username === 'ADMIN') return;
                var o = document.createElement('option');
                o.value = u.id;
                o.textContent = u.username;
                sel.appendChild(o);
            });
            sel.value = cur || '';
        }

        document.getElementById('btnAddUser').addEventListener('click', function() {
            document.getElementById('modalUserTitle').textContent = 'הוסף משתמש';
            document.getElementById('modalUserId').value = '';
            document.getElementById('modalUsername').value = '';
            document.getElementById('modalUsername').disabled = false;
            document.getElementById('modalPassword').value = '';
            document.getElementById('modalUser').classList.add('active');
        });

        function openEditUser(id, username) {
            document.getElementById('modalUserTitle').textContent = 'עדכון סיסמה: ' + username;
            document.getElementById('modalUserId').value = id;
            document.getElementById('modalUsername').value = username;
            document.getElementById('modalUsername').disabled = true;
            document.getElementById('modalPassword').value = '';
            document.getElementById('modalUser').classList.add('active');
        }

        document.getElementById('modalUserCancel').addEventListener('click', function() {
            document.getElementById('modalUser').classList.remove('active');
        });

        document.getElementById('modalUser').addEventListener('click', function(e) {
            if (e.target === this) document.getElementById('modalUser').classList.remove('active');
        });

        document.getElementById('modalUserSave').addEventListener('click', function() {
            var id = document.getElementById('modalUserId').value;
            var username = document.getElementById('modalUsername').value.trim();
            var password = document.getElementById('modalPassword').value;
            if (!username && !id) { toast('שם משתמש נדרש', true); return; }
            if (!password) { toast('סיסמה נדרשת', true); return; }
            if (id) {
                api('/admin/users/' + id, { method: 'PUT', body: JSON.stringify({ password: password }) })
                    .then(function(x) {
                        if (!x.ok) { toast(x.json && x.json.error ? x.json.error : 'שגיאה בעדכון', true); return; }
                        toast('סיסמה עודכנה');
                        document.getElementById('modalUser').classList.remove('active');
                        loadUsers();
                    });
            } else {
                api('/admin/users', { method: 'POST', body: JSON.stringify({ username: username, password: password }) })
                    .then(function(x) {
                        if (!x.ok) { toast(x.json && x.json.error ? x.json.error : 'שגיאה ביצירת משתמש', true); return; }
                        toast('משתמש נוצר');
                        document.getElementById('modalUser').classList.remove('active');
                        loadUsers();
                        fillProdFilterUsers();
                    });
            }
        });

        function deleteUser(id, username) {
            if (!confirm('למחוק את המשתמש "' + username + '"?')) return;
            api('/admin/users/' + id, { method: 'DELETE' }).then(function(x) {
                if (!x.ok) { toast(x.json && x.json.error ? x.json.error : 'שגיאה במחיקה', true); return; }
                toast('משתמש נמחק');
                loadUsers();
                fillProdFilterUsers();
                loadProductions();
            });
        }

        document.getElementById('btnRefreshProd').addEventListener('click', function() { loadProductions(); });
        document.getElementById('prodFilterUser').addEventListener('change', function() { loadProductions(); });
        document.getElementById('prodLimit').addEventListener('change', function() { loadProductions(); });
        document.getElementById('btnRefreshSessions').addEventListener('click', function() { loadSessions(); });

        var permissionsList = [];
        function openPermissionsModal(userId, username, currentPerms) {
            document.getElementById('modalPermissionsUserId').value = userId;
            document.getElementById('modalPermissionsTitle').textContent = 'הרשאות: ' + username;
            var container = document.getElementById('modalPermissionsCheckboxes');
            container.innerHTML = '';
            if (!permissionsList.length) {
                api('/admin/permissions-list').then(function(x) {
                    if (x.ok && x.json && x.json.permissions) permissionsList = x.json.permissions;
                    renderPermissionsCheckboxes(container, currentPerms);
                });
            } else {
                renderPermissionsCheckboxes(container, currentPerms);
            }
            document.getElementById('modalPermissions').classList.add('active');
        }
        function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
        function renderPermissionsCheckboxes(container, currentPerms) {
            container.innerHTML = '';
            permissionsList.forEach(function(p) {
                var div = document.createElement('div');
                div.className = 'permission-item';
                var checked = currentPerms.indexOf(p.id) >= 0;
                div.innerHTML = '<input type="checkbox" id="perm-' + esc(p.id) + '" value="' + esc(p.id) + '" ' + (checked ? 'checked' : '') + '><label for="perm-' + esc(p.id) + '">' + esc(p.label || p.id) + '</label>';
                container.appendChild(div);
            });
        }
        document.getElementById('modalPermissionsCancel').addEventListener('click', function() {
            document.getElementById('modalPermissions').classList.remove('active');
        });
        document.getElementById('modalPermissions').addEventListener('click', function(e) {
            if (e.target === this) document.getElementById('modalPermissions').classList.remove('active');
        });
        document.getElementById('modalPermissionsSave').addEventListener('click', function() {
            var userId = document.getElementById('modalPermissionsUserId').value;
            var perms = [];
            document.querySelectorAll('#modalPermissionsCheckboxes input:checked').forEach(function(cb) {
                perms.push(cb.value);
            });
            api('/admin/users/' + userId, { method: 'PUT', body: JSON.stringify({ permissions: perms }) }).then(function(x) {
                if (!x.ok) { toast(x.json && x.json.error ? x.json.error : 'שגיאה בשמירת הרשאות', true); return; }
                toast('הרשאות נשמרו');
                document.getElementById('modalPermissions').classList.remove('active');
                loadUsers();
            });
        });

        loadUsers().then(function() {
            fillProdFilterUsers();
            loadProductions();
        });
    </script>
</body>
</html>
