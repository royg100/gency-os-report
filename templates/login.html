<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgencyOS - כניסה למערכת</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/agencyos.css">
</head>
<body>

    <div class="login-card">
        <div class="logo-area">
            <img src="/logo.png" onerror="this.style.display='none'; document.getElementById('defIcon').style.display='block'">
            <i id="defIcon" class="fas fa-layer-group logo-icon" style="display:none"></i>
        </div>

        <h1>AgencyOS</h1>
        <p>מערכת ניהול סוכנות חכמה</p>

        <form onsubmit="event.preventDefault(); tryLogin();">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="user" placeholder="שם משתמש" autocomplete="username">
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="pass" placeholder="סיסמה" autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn-login">כניסה למערכת</button>
            <div id="errorMsg" class="error-msg"><i class="fas fa-exclamation-circle"></i> <span id="errorText">שם משתמש או סיסמה שגויים</span></div>
        </form>

        <div class="footer">
            V45.2 Enterprise Edition
        </div>
    </div>

    <script>
        function tryLogin() {
            const u = document.getElementById('user').value.trim();
            const p = document.getElementById('pass').value;
            const err = document.getElementById('errorMsg');
            const errText = document.getElementById('errorText');
            err.style.display = 'none';

            if (!u || !p) {
                errText.textContent = 'שם משתמש וסיסמה נדרשים';
                err.style.display = 'block';
                shake();
                return;
            }

            const fd = new FormData();
            fd.append('username', u);
            fd.append('password', p);

            fetch('/login', { method: 'POST', body: fd, credentials: 'include' })
                .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, status: r.status, json: j }; }); })
                .then(function(x) {
                    if (x.ok && x.json.success) {
                        window.location.href = '/';
                        return;
                    }
                    errText.textContent = (x.json && x.json.error) ? x.json.error : 'שם משתמש או סיסמה שגויים';
                    err.style.display = 'block';
                    shake();
                })
                .catch(function() {
                    errText.textContent = 'שגיאה בתקשורת. נסה שוב.';
                    err.style.display = 'block';
                    shake();
                });
        }

        function shake() {
            var card = document.querySelector('.login-card');
            if (card && card.animate) {
                card.animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-10px)' },
                    { transform: 'translateX(10px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 300 });
            }
        }
    </script>
</body>
</html>
