<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מרכז לקוחות CRM - AgencyOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/agencyos.css">
</head>
<body>
    <div class="top-bar">
        <span><i class="fas fa-users-cog"></i> מרכז לקוחות CRM</span>
        <div style="display:flex; gap:10px;">
            <a href="/360"><i class="fas fa-layer-group"></i> צור דשבורד</a>
            <a href="/logout"><i class="fas fa-sign-out-alt"></i> התנתקות</a>
        </div>
    </div>

    <div class="main">
        <div class="card">
            <h2><i class="fas fa-list"></i> רשימת לקוחות ודשבורדים</h2>
            <div id="loading" class="loading"><i class="fas fa-spinner fa-spin"></i> טוען...</div>
            <div id="empty" class="empty-msg" style="display:none;">אין דשבורדים. <a href="/360">העלה קבצים במבט 360</a> כדי לשמור לקוחות.</div>
            <div id="table-wrap" style="display:none; overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>משפחה / לקוח</th>
                            <th>מזהה דשבורד</th>
                            <th>תאריך</th>
                            <th>פעולות</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const loading = document.getElementById('loading');
            const empty = document.getElementById('empty');
            const tableWrap = document.getElementById('table-wrap');
            const tbody = document.getElementById('tbody');

            function fmtDate(iso) {
                if (!iso) return '-';
                try {
                    const d = new Date(iso);
                    return d.toLocaleDateString('he-IL', { day: 'numeric', month: 'short', year: 'numeric' });
                } catch (e) { return iso; }
            }

            function openDashboard(id) {
                window.location.href = '/360?dashboard_id=' + encodeURIComponent(id);
            }

            function openInCrm(id) {
                fetch('/api/dashboards/' + encodeURIComponent(id), { credentials: 'include' })
                    .then(function(r) {
                        if (!r.ok) throw new Error('שגיאה בטעינת דשבורד');
                        return r.json();
                    })
                    .then(function(full) {
                        const family = (full.family_name || 'כללי').trim();
                        const report = (full.reports && full.reports[0]) || {};
                        const raw = report.raw_data || {};
                        const ctx = {
                            family_name: family,
                            dashboard_id: id,
                            raw_data: { raw_ins: raw.raw_ins || [], raw_fin: raw.raw_fin || [], members: raw.members || {} }
                        };
                        sessionStorage.setItem('crm_context', JSON.stringify(ctx));
                        window.location.href = '/client.html?from=menu_crm&family=' + encodeURIComponent(family) + '&dashboard_id=' + encodeURIComponent(id);
                    })
                    .catch(function(e) {
                        alert('לא ניתן לפתוח ב-CRM: ' + (e.message || 'שגיאה'));
                    });
            }

            fetch('/api/dashboards', { credentials: 'include' })
                .then(function(r) {
                    if (r.status === 401) { window.location.href = '/login'; return []; }
                    if (!r.ok) throw new Error('שגיאה בטעינת רשימה');
                    return r.json();
                })
                .then(function(list) {
                    loading.style.display = 'none';
                    if (!list || list.length === 0) {
                        empty.style.display = 'block';
                        return;
                    }
                    tableWrap.style.display = 'block';
                    tbody.innerHTML = list.map(function(d) {
                        const fam = (d.family_name || 'כללי').trim();
                        const id = (d.id || '').replace(/'/g, "\\'");
                        return '<tr>' +
                            '<td>' + (fam || '-') + '</td>' +
                            '<td><code>' + (d.id || '') + '</code></td>' +
                            '<td>' + fmtDate(d.created_at) + '</td>' +
                            '<td class="actions-cell">' +
                            '<button type="button" class="btn btn-dash" onclick="openDashboard(\'' + id + '\')"><i class="fas fa-chart-line"></i> פתח דשבורד</button> ' +
                            '<button type="button" class="btn btn-crm" onclick="openInCrm(\'' + id + '\')"><i class="fas fa-user"></i> פתח ב-CRM</button>' +
                            '</td></tr>';
                    }).join('');
                    window.openDashboard = openDashboard;
                    window.openInCrm = openInCrm;
                })
                .catch(function(e) {
                    loading.style.display = 'none';
                    empty.style.display = 'block';
                    empty.textContent = 'שגיאה בטעינה: ' + (e.message || 'לא ידוע');
                });
        })();
    </script>
</body>
</html>
